<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timer Mengerjakan Soal</title>
    <meta name="theme-color" content="#0b1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Timer Soal">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }

        /* ============================================================
           VARIABEL TEMA
           ============================================================ */
        :root {
            --bg-grad-1: #0b1a2e;
            --bg-grad-2: #1b2f45;

            --card-bg: rgba(18, 30, 45, 0.85);
            --card-border: rgba(120,180,255,0.2);
            --card-shadow: 0 30px 45px -15px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,255,0.08);

            --title-color: #c6e2ff;

            --timer-bg: #0a121c;
            --timer-border: #2d4b6e;
            --timer-text-1: #ffffff;
            --timer-text-2: #aad0ff;

            --progress-bg: #0e1a28;
            --progress-border: #2f4e6b;

            --label-color: #9bb9da;
            --input-bg: #0f1b29;
            --input-border: #2e4b6b;
            --input-color: #e3f0ff;

            --btn-bg-1: #253c52;
            --btn-bg-2: #1a2b3d;
            --btn-border: #3e6085;
            --btn-color: #d2e5ff;

            --btn-primary-bg-1: #2a5f9c;
            --btn-primary-bg-2: #1e4272;
            --btn-primary-border: #5f9fff;
            --btn-primary-color: #ffffff;

            --btn-danger-bg-1: #6c2e2e;
            --btn-danger-bg-2: #4a1f1f;
            --btn-danger-border: #b35e5e;
            --btn-danger-color: #ffe9e9;

            --theme-btn-bg: rgba(45, 75, 110, 0.6);
            --theme-btn-border: rgba(120,180,255,0.35);
            --theme-btn-color: #c6e2ff;
        }

        /* ============================================================
           TEMA TERANG
           ============================================================ */
        body.light {
            --bg-grad-1: #e8f0fb;
            --bg-grad-2: #cfdff2;

            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(120,150,200,0.35);
            --card-shadow: 0 30px 45px -15px rgba(60,90,140,0.35), inset 0 1px 3px rgba(255,255,255,0.9);

            --title-color: #1e3a5f;

            --timer-bg: #f2f6fc;
            --timer-border: #b5c9e0;
            --timer-text-1: #1e3a5f;
            --timer-text-2: #4a7ab5;

            --progress-bg: #dce6f2;
            --progress-border: #b5c9e0;

            --label-color: #3e5a7a;
            --input-bg: #f2f6fc;
            --input-border: #b5c9e0;
            --input-color: #1e3a5f;

            --btn-bg-1: #e0e9f5;
            --btn-bg-2: #c8d6e8;
            --btn-border: #8fa9c7;
            --btn-color: #1e3a5f;

            --btn-primary-bg-1: #4a8ad0;
            --btn-primary-bg-2: #2e6bb0;
            --btn-primary-border: #2e6bb0;
            --btn-primary-color: #ffffff;

            --btn-danger-bg-1: #d96363;
            --btn-danger-bg-2: #b84444;
            --btn-danger-border: #a83a3a;
            --btn-danger-color: #ffffff;

            --theme-btn-bg: rgba(255, 255, 255, 0.7);
            --theme-btn-border: rgba(120,150,200,0.5);
            --theme-btn-color: #1e3a5f;
        }

        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(145deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            padding: 1rem;
            transition: background 0.4s ease;
        }

        .card {
            position: relative;
            background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 2.5rem; padding: 2.5rem 2rem; max-width: 550px; width: 100%;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border); text-align: center;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        h1 { font-size: 1.9rem; font-weight: 600; color: var(--title-color); margin-bottom: 1.2rem; letter-spacing: 1px;
             transition: color 0.4s ease; }

        /* ============================================================
           TOMBOL TEMA (pojok kanan atas)
           ============================================================ */
        .theme-toggle {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-btn-border);
            color: var(--theme-btn-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            backdrop-filter: blur(8px);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1),
                        background 0.4s ease,
                        border-color 0.4s ease,
                        color 0.4s ease,
                        box-shadow 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .theme-toggle:hover {
            transform: scale(1.08) rotate(12deg);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25), 0 0 20px rgba(95,159,255,0.35);
        }
        .theme-toggle:active {
            transform: scale(0.96);
        }
        .theme-toggle svg {
            width: 22px; height: 22px;
            transition: opacity 0.25s ease, transform 0.4s ease;
        }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: opacity 0.3s ease, transform 0.4s ease;
        }
        .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.6); }
        .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }

        body.light .theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
        body.light .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.6); }

        .timer-container {
            background: var(--timer-bg); border-radius: 4rem; padding: 0.8rem 1.5rem;
            margin: 1.8rem 0 2rem 0; display: inline-block; border: 1px solid var(--timer-border);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.35), 0 8px 18px rgba(0,0,0,0.25);
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        #timer-display {
            font-size: 5.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
            letter-spacing: 8px; line-height: 1.2;
            background: linear-gradient(180deg, var(--timer-text-1) 0%, var(--timer-text-2) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            transition: background 0.4s ease;
        }
        .timer-warning #timer-display {
            background: linear-gradient(180deg, #ffb3b3 0%, #ff6a6a 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .timer-danger #timer-display {
            background: linear-gradient(180deg, #ff9e9e 0%, #ff3a3a 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0.85; } }

        .progress-bar {
            width: 100%; height: 10px; background: var(--progress-bg); border-radius: 20px;
            margin: 1rem 0 2rem 0; overflow: hidden; border: 1px solid var(--progress-border);
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        #progress-fill {
            height: 100%; width: 100%; border-radius: 20px;
            background: linear-gradient(90deg, #2d9cdb, #6bc9ff, #2d9cdb);
            transition: width 0.3s ease, background 0.3s;
        }

        .input-group {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 14px; margin: 24px 0 26px;
        }
        .input-group label { color: var(--label-color); font-weight: 500; font-size: 1.1rem;
                              display: flex; align-items: center; gap: 8px;
                              transition: color 0.4s ease; }
        .input-group input {
            background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 3rem;
            padding: 0.9rem 1.4rem; width: 110px; font-size: 1.3rem; font-weight: 600;
            text-align: center; color: var(--input-color); outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease,
                        background 0.4s ease, color 0.4s ease;
        }
        .input-group input:focus {
            border-color: #5f9fff; box-shadow: 0 0 0 3px rgba(95,159,255,0.2);
        }
        .input-group input:disabled { opacity: 0.6; }

        /* ============================================================
           TOMBOL UTAMA
           ============================================================ */
        .button-group {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
            margin-bottom: 10px;
        }
        .btn {
            position: relative;
            background: linear-gradient(180deg, var(--btn-bg-1) 0%, var(--btn-bg-2) 100%);
            border: 1px solid var(--btn-border);
            border-radius: 4rem;
            padding: 0.9rem 1.9rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--btn-color);
            cursor: pointer;
            flex: 1 1 130px;
            min-width: 130px;
            letter-spacing: 0.3px;
            box-shadow:
                0 6px 16px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.08);
            transition:
                transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1),
                box-shadow 0.25s ease,
                background 0.4s ease,
                border-color 0.25s ease,
                color 0.4s ease;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .btn::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 60%);
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.25s ease;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow:
                0 12px 24px rgba(0,0,0,0.5),
                0 0 20px rgba(95,159,255,0.28),
                inset 0 1px 0 rgba(255,255,255,0.15);
            border-color: #5f9fff;
            color: #ffffff;
        }
        .btn:hover:not(:disabled)::before { opacity: 1; }
        .btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow:
                0 3px 8px rgba(0,0,0,0.45),
                inset 0 2px 4px rgba(0,0,0,0.35);
        }
        .btn:focus-visible {
            outline: none;
            box-shadow:
                0 6px 16px rgba(0,0,0,0.35),
                0 0 0 3px rgba(95,159,255,0.45);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.4);
            pointer-events: none;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--btn-primary-bg-1) 0%, var(--btn-primary-bg-2) 100%);
            border-color: var(--btn-primary-border);
            color: var(--btn-primary-color);
            box-shadow:
                0 6px 16px rgba(45,156,219,0.35),
                inset 0 1px 0 rgba(255,255,255,0.18);
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow:
                0 12px 26px rgba(45,156,219,0.5),
                0 0 26px rgba(95,159,255,0.45),
                inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .btn-danger {
            background: linear-gradient(180deg, var(--btn-danger-bg-1) 0%, var(--btn-danger-bg-2) 100%);
            border-color: var(--btn-danger-border);
            color: var(--btn-danger-color);
            box-shadow:
                0 6px 16px rgba(179,62,62,0.3),
                inset 0 1px 0 rgba(255,255,255,0.12);
        }
        .btn-danger:hover:not(:disabled) {
            border-color: #ff8a8a;
            box-shadow:
                0 12px 26px rgba(179,62,62,0.45),
                0 0 22px rgba(255,110,110,0.35),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .sound-toggle {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 1.2rem; color: var(--label-color); font-size: 1rem;
            transition: color 0.4s ease;
        }
        .sound-toggle input { width: 18px; height: 18px; accent-color: #4fa6ff; cursor: pointer; }

        @media (max-width: 420px) {
            #timer-display { font-size: 4rem; letter-spacing: 4px; }
            .btn { flex: 1 1 45%; padding: 0.8rem 1.2rem; font-size: 1rem; min-width: 100px; }
            .theme-toggle { width: 42px; height: 42px; top: 1rem; right: 1rem; }
            .card { padding: 2rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <button class="theme-toggle" id="themeToggle" title="Ganti tema" aria-label="Ganti tema">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
        </button>

        <h1>TIMER SOAL</h1>

        <div class="timer-container" id="timerContainer">
            <div id="timer-display">05:00</div>
        </div>

        <div class="progress-bar">
            <div id="progress-fill" style="width: 100%;"></div>
        </div>

        <div class="input-group">
            <label>Menit <input type="number" id="input-minutes" value="5" min="0" max="180"></label>
            <label>Detik <input type="number" id="input-seconds" value="0" min="0" max="59"></label>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="startBtn">Mulai</button>
            <button class="btn btn-secondary" id="pauseBtn" disabled>Jeda</button>
            <button class="btn btn-danger" id="resetBtn">Reset</button>
        </div>

        <div class="sound-toggle">
            <input type="checkbox" id="soundToggle" checked>
            <label for="soundToggle">Aktifkan Suara</label>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // DOM ELEMEN
            // ============================================================
            const timerDisplay = document.getElementById('timer-display');
            const progressFill = document.getElementById('progress-fill');
            const inputMinutes = document.getElementById('input-minutes');
            const inputSeconds = document.getElementById('input-seconds');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');
            const timerContainer = document.getElementById('timerContainer');
            const soundToggle = document.getElementById('soundToggle');
            const themeToggle = document.getElementById('themeToggle');

            // ============================================================
            // TEMA (gelap / terang)
            // ============================================================
            const TEMA_KEY = 'timer-soal-tema';

            function applyTheme(theme) {
                if (theme === 'light') {
                    document.body.classList.add('light');
                } else {
                    document.body.classList.remove('light');
                }
                try { localStorage.setItem(TEMA_KEY, theme); } catch(e) {}
            }

            function initTheme() {
                let saved = null;
                try { saved = localStorage.getItem(TEMA_KEY); } catch(e) {}
                if (saved === 'light' || saved === 'dark') {
                    applyTheme(saved);
                } else {
                    // Ikuti preferensi sistem
                    const prefersLight = window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: light)').matches;
                    applyTheme(prefersLight ? 'light' : 'dark');
                }
            }

            themeToggle.addEventListener('click', () => {
                const isLight = document.body.classList.contains('light');
                applyTheme(isLight ? 'dark' : 'light');
            });

            // ============================================================
            // STATE TIMER
            // ============================================================
            let totalSeconds = 300;
            let remainingSeconds = 300;
            let timerInterval = null;
            let isRunning = false;
            let isPaused = false;
            let menitSudahDiucapkan = [];

            // ============================================================
            // WEB AUDIO API
            // ============================================================
            const SUARA_PATH = 'suara/';
            let audioCtx = null;
            const audioBuffers = {};

            const DAFTAR_FILE = [
                'mulai', 'jeda', 'reset', 'waktu-habis',
                'sepuluh-menit-lagi', 'dua-puluh-menit-lagi',
                'tiga-puluh-menit-lagi', 'empat-puluh-menit-lagi',
                'lima-puluh-menit-lagi', 'enam-puluh-menit-lagi',
                'sepuluh', 'sembilan', 'delapan', 'tujuh', 'enam',
                'lima', 'empat', 'tiga', 'dua', 'satu'
            ];

            function getAudioContext() {
                if (!audioCtx) {
                    try {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch(e) {
                        console.error('Web Audio API tidak didukung:', e);
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            async function loadAllSounds() {
                const ctx = getAudioContext();
                if (!ctx) return;

                for (const nama of DAFTAR_FILE) {
                    if (audioBuffers[nama]) continue;
                    try {
                        const resp = await fetch(SUARA_PATH + nama + '.mp3');
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const arrayBuf = await resp.arrayBuffer();
                        const audioBuf = await ctx.decodeAudioData(arrayBuf);
                        audioBuffers[nama] = audioBuf;
                    } catch (e) {
                        console.warn('Gagal load ' + nama + '.mp3 ->', e.message);
                    }
                }
            }

            let activeSources = [];
            function playVoice(nama, interrupt = true) {
                if (!soundToggle.checked) return;
                const ctx = getAudioContext();
                if (!ctx) return;

                const buffer = audioBuffers[nama];
                if (!buffer) {
                    playBeep(800, 0.15, 'sine', 0.4);
                    return;
                }

                if (interrupt) {
                    activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
                    activeSources = [];
                }

                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(0);
                activeSources.push(source);

                source.onended = () => {
                    activeSources = activeSources.filter(s => s !== source);
                };
            }

            function isAudioReady() {
                return Object.keys(audioBuffers).length > 0;
            }

            // ============================================================
            // PETA NAMA FILE
            // ============================================================
            const NAMA_ANGKA = {
                10: 'sepuluh', 9: 'sembilan', 8: 'delapan', 7: 'tujuh', 6: 'enam',
                5: 'lima', 4: 'empat', 3: 'tiga', 2: 'dua', 1: 'satu'
            };
            const NAMA_MENIT = {
                60: 'enam-puluh-menit-lagi',
                50: 'lima-puluh-menit-lagi',
                40: 'empat-puluh-menit-lagi',
                30: 'tiga-puluh-menit-lagi',
                20: 'dua-puluh-menit-lagi',
                10: 'sepuluh-menit-lagi'
            };

            function playAngka(angka) {
                const nama = NAMA_ANGKA[angka];
                if (nama) playVoice(nama);
            }
            function playMenit(menitKe) {
                const nama = NAMA_MENIT[menitKe];
                if (nama) playVoice(nama);
            }

            // ============================================================
            // BEEP
            // ============================================================
            function playBeep(freq = 880, duration = 0.15, type = 'sine', volume = 0.5, delay = 0) {
                if (!soundToggle.checked) return;
                const ctx = getAudioContext();
                if (!ctx) return;
                const t = ctx.currentTime + delay;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(volume, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + duration + 0.02);
            }
            function playAlarmSound() {
                playBeep(1000, 0.12, 'square', 0.4, 0);
                playBeep(1000, 0.12, 'square', 0.4, 0.18);
            }
            function playTimeUpSound() {
                playBeep(880, 0.3, 'sawtooth', 0.5, 0);
                playBeep(660, 0.3, 'sawtooth', 0.5, 0.4);
                playBeep(440, 0.6, 'sawtooth', 0.5, 0.8);
            }

            // ============================================================
            // UTIL
            // ============================================================
            function formatTime(s) {
                if (s < 0) s = 0;
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
            }

            function updateDisplay() {
                timerDisplay.textContent = formatTime(remainingSeconds);
                const percent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
                progressFill.style.width = Math.max(0, percent) + '%';

                if (remainingSeconds <= 0) {
                    progressFill.style.background = 'linear-gradient(90deg, #b33e3e, #ff6b6b)';
                } else if (remainingSeconds <= 30) {
                    progressFill.style.background = 'linear-gradient(90deg, #c0392b, #e74c3c, #ff5e5e)';
                } else if (remainingSeconds <= 60) {
                    progressFill.style.background = 'linear-gradient(90deg, #e67e22, #f39c12, #ffb347)';
                } else {
                    progressFill.style.background = 'linear-gradient(90deg, #2d9cdb, #6bc9ff, #2d9cdb)';
                }

                timerContainer.classList.remove('timer-warning', 'timer-danger');
                if (remainingSeconds <= 10 && remainingSeconds > 0) {
                    timerContainer.classList.add('timer-danger');
                } else if (remainingSeconds <= 30 && remainingSeconds > 0) {
                    timerContainer.classList.add('timer-warning');
                }
            }

            function setButtonsIdle() {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                inputMinutes.disabled = false;
                inputSeconds.disabled = false;
            }
            function setButtonsRunning() {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                inputMinutes.disabled = true;
                inputSeconds.disabled = true;
            }
            function setButtonsPaused() {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                inputMinutes.disabled = true;
                inputSeconds.disabled = true;
            }

            function stopTimer() {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                isRunning = false;
                isPaused = false;
                setButtonsIdle();
            }

            // ============================================================
            // TIMER UTAMA
            // ============================================================
            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                isRunning = true;
                isPaused = false;
                setButtonsRunning();

                menitSudahDiucapkan = [];
                updateDisplay();

                timerInterval = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;

                        const sisaMenit = Math.ceil(remainingSeconds / 60);
                        if (sisaMenit > 0 && sisaMenit % 10 === 0 && !menitSudahDiucapkan.includes(sisaMenit)) {
                            menitSudahDiucapkan.push(sisaMenit);
                            playMenit(sisaMenit);
                        }

                        if (remainingSeconds <= 10 && remainingSeconds > 0) {
                            playAngka(remainingSeconds);
                        } else if (remainingSeconds <= 30 && remainingSeconds > 10) {
                            playAlarmSound();
                        }

                        updateDisplay();

                        if (remainingSeconds <= 0) {
                            stopTimer();
                            updateDisplay();
                            playTimeUpSound();
                            setTimeout(() => playVoice('waktu-habis'), 800);
                        }
                    } else {
                        stopTimer();
                        updateDisplay();
                    }
                }, 1000);
            }

            // ============================================================
            // INPUT & RESET
            // ============================================================
            function getInputTotalSeconds() {
                let m = parseInt(inputMinutes.value, 10);
                let s = parseInt(inputSeconds.value, 10);
                if (isNaN(m) || m < 0) m = 0;
                if (isNaN(s) || s < 0) s = 0;
                if (s > 59) s = 59;
                if (m > 180) m = 180;
                return (m * 60) + s;
            }

            function syncInputsFromTotal(sec) {
                inputMinutes.value = Math.floor(sec / 60);
                inputSeconds.value = sec % 60;
            }

            function resetTimerFromInput() {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                isRunning = false;
                isPaused = false;
                menitSudahDiucapkan = [];

                activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
                activeSources = [];

                const total = getInputTotalSeconds();
                if (total <= 0) {
                    totalSeconds = 0;
                    remainingSeconds = 0;
                    updateDisplay();
                    startBtn.disabled = true;
                    pauseBtn.disabled = true;
                    inputMinutes.disabled = false;
                    inputSeconds.disabled = false;
                    return;
                }

                totalSeconds = total;
                remainingSeconds = total;
                setButtonsIdle();

                updateDisplay();
                timerContainer.classList.remove('timer-warning', 'timer-danger');
            }

            function resetToDefault() {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                isRunning = false;
                isPaused = false;
                menitSudahDiucapkan = [];

                activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
                activeSources = [];

                totalSeconds = 300;
                remainingSeconds = 300;
                syncInputsFromTotal(300);

                setButtonsIdle();
                updateDisplay();
                timerContainer.classList.remove('timer-warning', 'timer-danger');
            }

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            startBtn.addEventListener('click', async () => {
                getAudioContext();

                if (!isAudioReady()) {
                    await loadAllSounds();
                }

                if (remainingSeconds <= 0) {
                    const t = getInputTotalSeconds();
                    if (t <= 0) return;
                    totalSeconds = t;
                    remainingSeconds = t;
                    syncInputsFromTotal(t);
                }

                if (remainingSeconds > 0) {
                    playVoice('mulai');
                    startTimer();
                }
            });

            pauseBtn.addEventListener('click', () => {
                if (isRunning && !isPaused) {
                    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                    isRunning = false;
                    isPaused = true;
                    setButtonsPaused();
                    playVoice('jeda');
                }
            });

            resetBtn.addEventListener('click', () => {
                getAudioContext();
                resetToDefault();
                playVoice('reset');
            });

            function handleInputChange() {
                if (isRunning || isPaused) return;
                let m = parseInt(inputMinutes.value, 10);
                let s = parseInt(inputSeconds.value, 10);
                if (isNaN(m) || m < 0) m = 0;
                if (isNaN(s) || s < 0) s = 0;
                if (s > 59) { s = 59; inputSeconds.value = 59; }
                if (m > 180) { m = 180; inputMinutes.value = 180; }
                const total = (m * 60) + s;
                totalSeconds = total;
                remainingSeconds = total;
                startBtn.disabled = total <= 0;
                updateDisplay();
            }
            inputMinutes.addEventListener('input', handleInputChange);
            inputSeconds.addEventListener('input', handleInputChange);

            soundToggle.addEventListener('change', () => {
                if (soundToggle.checked) {
                    getAudioContext();
                } else {
                    activeSources.forEach(s => { try { s.stop(); } catch(e) {} });
                    activeSources = [];
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            (function init() {
                initTheme();

                totalSeconds = 300;
                remainingSeconds = 300;
                syncInputsFromTotal(300);
                updateDisplay();
                setButtonsIdle();
                timerContainer.classList.remove('timer-warning', 'timer-danger');

                loadAllSounds();

                document.body.addEventListener('click', function initAudioOnce() {
                    getAudioContext();
                    document.body.removeEventListener('click', initAudioOnce);
                }, { once: true });
            })();

        })();
    </script>
</body>
</html>
