<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#1b2f45"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f9fff"/>
      <stop offset="100%" stop-color="#2a5f9c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <!-- Top button -->
  <rect x="236" y="55" width="40" height="40" rx="8" fill="#5f9fff"/>
  <rect x="216" y="40" width="80" height="18" rx="8" fill="#8ec5fc"/>
  <!-- Side buttons -->
  <rect x="360" y="85" width="20" height="35" rx="6" fill="#5f9fff" transform="rotate(35 370 102)"/>
  <!-- Outer circle -->
  <circle cx="256" cy="280" r="165" fill="none" stroke="url(#ringGrad)" stroke-width="20" filter="url(#glow)"/>
  <circle cx="256" cy="280" r="140" fill="#0a121c"/>
  <!-- Clock ticks -->
  <line x1="256" y1="155" x2="256" y2="175" stroke="#5f9fff" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="385" x2="256" y2="405" stroke="#5f9fff" stroke-width="6" stroke-linecap="round"/>
  <line x1="131" y1="280" x2="151" y2="280" stroke="#5f9fff" stroke-width="6" stroke-linecap="round"/>
  <line x1="361" y1="280" x2="381" y2="280" stroke="#5f9fff" stroke-width="6" stroke-linecap="round"/>
  <!-- Clock hands -->
  <circle cx="256" cy="280" r="14" fill="#ffffff"/>
  <line x1="256" y1="280" x2="256" y2="195" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="315" y2="280" stroke="#5f9fff" stroke-width="8" stroke-linecap="round"/>
</svg>
